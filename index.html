<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PULSE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#05050c;overflow:hidden;font-family:system-ui,Arial,sans-serif;color:#fff;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{touch-action:none;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;background:#0a0a18}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(5,5,12,.85);z-index:5}
.screen.on{display:flex}
h1{font-size:72px;letter-spacing:12px;text-shadow:0 0 24px #0ff}
h2{font-size:36px;letter-spacing:4px}
button{font:inherit;font-size:22px;font-weight:700;padding:14px 40px;border:2px solid #0ff;background:transparent;color:#0ff;border-radius:10px;cursor:pointer;min-width:260px}
button:hover{background:#0ff;color:#05050c}
#grid{display:grid;grid-template-columns:repeat(5,minmax(0,140px));gap:14px;width:min(760px,94vw)}
.lv{min-width:0;padding:14px 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lv b{font-size:30px}
.lv.lock{opacity:.3;pointer-events:none}
.stars{color:#ffd23f;font-size:22px;letter-spacing:3px}
p{opacity:.8}
#fsBtn{position:fixed;top:12px;right:12px;z-index:20;width:44px;height:44px;min-width:0;padding:0;
  display:flex;align-items:center;justify-content:center;background:#0008;border:2px solid #0ff;border-radius:10px;box-shadow:0 0 10px #0ff}
#fsBtn:hover{background:#0ff3}
#fsBtn svg{width:24px;height:24px;stroke:#0ff;fill:none;stroke-width:2.5;pointer-events:none}
body.playing #fsBtn{display:none}
body.playing,body.playing *{cursor:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen on">
  <h1>PULSE</h1>
  <button id="bLevels">NÍVEIS</button>
  <button id="bEndless">INFINITO</button>
  <p id="best"></p>
</div>

<div id="levels" class="screen">
  <h2>NÍVEIS</h2>
  <div id="grid"></div>
  <button id="bBack">VOLTAR</button>
</div>

<div id="result" class="screen">
  <h2 id="rTitle"></h2>
  <div class="stars" id="rStars"></div>
  <p id="rInfo"></p>
  <button id="bRetry">JOGAR DE NOVO</button>
  <button id="bNext">PRÓXIMO ▶</button>
  <button id="bMenu">MENU</button>
</div>

<button id="fsBtn" title="Tela cheia (F)">
  <svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>
</button>

<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<script src="game.js"></script>
</body>
</html>
